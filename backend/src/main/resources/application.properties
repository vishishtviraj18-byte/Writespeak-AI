spring.application.name=writespeak-ai
server.port=8080

# MongoDB — uses env variable (set in deployment platform / .env.local)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/writespeak}

# JWT Settings — uses env variable only
jwt.secret=${JWT_SECRET:change-this-secret-in-production}
# 24 hours in milliseconds
jwt.expiration=86400000

# CORS Allowed Origins (comma-separated; override via env var on AWS)
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Actuator — expose /actuator/health for EC2 health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
