spring.application.name=writespeak-ai
server.port=8080

# MongoDB — uses env variable (set in deployment platform / .env.local)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/writespeak}

# JWT Settings — uses env variable only
jwt.secret=${JWT_SECRET:change-this-secret-in-production}
# 24 hours in milliseconds
jwt.expiration=86400000

# CORS Allowed Origins
cors.allowed.origins=http://localhost:5173
