services:
  # -- Backend: Spring Boot (Docker)
  - type: web
    name: writespeak-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SPRING_DATA_MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JAVA_OPTS
        value: -Xmx512m

  # -- Frontend: React Static Site
  - type: web
    name: writespeak-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
